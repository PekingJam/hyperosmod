name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOSMod
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HyperOSMod
          path: artifacts

      - name: Rename APK
        run: mv artifacts/app-release.apk "artifacts/HyperOSMod-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/HyperOSMod-*.apk
          generate_release_notes: true

  release-main:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout for rolling tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Move rolling tag
        run: |
          git tag -f main-latest "$GITHUB_SHA"
          git push -f origin "refs/tags/main-latest"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HyperOSMod
          path: artifacts

      - name: Rename APK
        run: mv artifacts/app-release.apk artifacts/HyperOSMod-main.apk

      - name: Publish/update rolling main release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: Latest main build
          body: |
            Automatic build from the main branch.

            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: false
          make_latest: 'true'
          files: artifacts/HyperOSMod-main.apk
          overwrite_files: true
          fail_on_unmatched_files: true
